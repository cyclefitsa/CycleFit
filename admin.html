<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CycleFit – لوحة الإدارة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --g: #10B981; --gl: #34D399; --gd: #059669;
      --bg: #0a0a0f; --bg2: #111118; --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08); --text: #f0f0f5; --sub: #8888aa;
      --warn: #f59e0b; --danger: #ef4444; --info: #3b82f6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LOGIN ── */
    #login-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse 60% 60% at 50% 40%, rgba(16,185,129,.1) 0%, transparent 70%);
    }
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
    }
    .login-card h1 { font-size: 1.6rem; font-weight: 900; color: var(--gl); margin-bottom: 4px; }
    .login-card p  { color: var(--sub); font-size: .85rem; margin-bottom: 28px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: .8rem; color: var(--sub); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 13px 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: 'Cairo',sans-serif; font-size: .95rem;
      outline: none; transition: border-color .2s;
      text-align: right;
    }
    .field input:focus { border-color: var(--gl); }
    .field input::placeholder { color: rgba(255,255,255,.2); }
    .btn {
      width: 100%; padding: 14px;
      border: none; border-radius: 12px;
      font-family: 'Cairo',sans-serif; font-weight: 700; font-size: .95rem;
      cursor: pointer; transition: all .2s;
    }
    .btn-primary { background: linear-gradient(135deg,var(--g),var(--gl)); color: #021a12; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16,185,129,.3); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-danger  { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); color: var(--danger); }
    .btn-danger:hover { background: rgba(239,68,68,.25); }
    .btn-success { background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.3); color: var(--gl); }
    .btn-success:hover { background: rgba(16,185,129,.25); }
    .btn-sm { padding: 8px 16px; font-size: .8rem; border-radius: 8px; width: auto; }

    /* ── DASHBOARD LAYOUT ── */
    #dashboard { display: none; min-height: 100vh; }
    .topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-brand { display: flex; align-items: center; gap: 12px; }
    .topbar-brand .logo { font-size: 1.3rem; font-weight: 900; color: var(--gl); }
    .topbar-brand .badge { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); color: var(--danger); border-radius: 6px; padding: 3px 10px; font-size: .7rem; font-weight: 700; }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .admin-name { font-size: .85rem; color: var(--sub); }
    #btn-logout { background: none; border: 1px solid var(--border); color: var(--sub); padding: 7px 16px; border-radius: 8px; font-family: 'Cairo',sans-serif; font-size: .8rem; cursor: pointer; }
    #btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    .content { padding: 28px; max-width: 1100px; margin: 0 auto; }

    /* ── STATS ROW ── */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 20px;
    }
    .stat-card .stat-val { font-size: 2rem; font-weight: 900; }
    .stat-card .stat-lbl { font-size: .75rem; color: var(--sub); margin-top: 2px; }
    .stat-available .stat-val { color: var(--gl); }
    .stat-pending .stat-val   { color: var(--warn); }
    .stat-active .stat-val    { color: var(--info); }
    .stat-rented .stat-val    { color: var(--danger); }

    /* ── SECTION ── */
    .section { margin-bottom: 32px; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-header h2 { font-size: 1.1rem; font-weight: 700; }
    .badge-count {
      background: var(--warn);
      color: #000;
      border-radius: 50px;
      padding: 2px 10px;
      font-size: .75rem;
      font-weight: 700;
      margin-right: 8px;
    }

    /* ── TABLE / BOOKING CARDS ── */
    .booking-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 16px;
      transition: border-color .2s;
    }
    .booking-card:hover { border-color: rgba(255,255,255,.15); }
    .booking-card.pending-card { border-color: rgba(245,158,11,.25); }
    .booking-card.active-card  { border-color: rgba(59,130,246,.25); }
    .bc-avatar {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
    }
    .bc-avatar.pending { background: rgba(245,158,11,.1); }
    .bc-avatar.active  { background: rgba(59,130,246,.1); }
    .bc-info { flex: 1; min-width: 0; }
    .bc-name  { font-weight: 700; font-size: .95rem; }
    .bc-meta  { font-size: .78rem; color: var(--sub); margin-top: 3px; display: flex; gap: 14px; flex-wrap: wrap; }
    .bc-timer { font-size: .85rem; font-weight: 700; color: var(--info); font-variant-numeric: tabular-nums; }
    .bc-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* ── BIKES GRID ── */
    .bikes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 12px; }
    .bike-tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      transition: border-color .2s;
    }
    .bike-tile .tile-name { font-weight: 700; font-size: .9rem; margin: 8px 0 4px; }
    .bike-tile .tile-status { font-size: .75rem; }
    .tile-available { border-color: rgba(16,185,129,.2); }
    .tile-available .tile-icon { background: rgba(16,185,129,.1); }
    .tile-rented    { border-color: rgba(239,68,68,.2); }
    .tile-rented .tile-icon    { background: rgba(239,68,68,.1); }
    .tile-pending   { border-color: rgba(245,158,11,.2); }
    .tile-pending .tile-icon   { background: rgba(245,158,11,.1); }
    .tile-icon {
      width: 46px; height: 46px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; margin: 0 auto;
    }

    /* ── ADD BIKE FORM ── */
    .add-bike-row {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .add-bike-row input {
      flex: 1; min-width: 160px;
      padding: 10px 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: 'Cairo',sans-serif; font-size: .9rem;
      outline: none;
    }
    .add-bike-row input:focus { border-color: var(--gl); }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 20px;
      font-size: .85rem; transition: all .3s;
      opacity: 0; pointer-events: none; z-index: 999;
    }
    #toast.show { opacity: 1; }
    #toast.success { border-color: var(--gl); color: var(--gl); }
    #toast.error   { border-color: var(--danger); color: var(--danger); }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.2); border-top-color: currentColor;
      border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { text-align: center; color: var(--sub); padding: 30px 0; font-size: .9rem; }

    @media (max-width: 640px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .content { padding: 16px; }
      .bc-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-wrap">
  <div class="login-card">
    <h1>🔐 CycleFit Admin</h1>
    <p>لوحة إدارة الموظفين – أدخل بياناتك للمتابعة</p>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="inp-email" placeholder="admin@cyclefit.sa" dir="ltr" />
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="inp-pass" placeholder="••••••••" dir="ltr" />
    </div>
    <button class="btn btn-primary" id="btn-login">تسجيل الدخول</button>
  </div>
</div>

<!-- ══ DASHBOARD ══ -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-brand">
      <span class="logo">🚲 CycleFit</span>
      <span class="badge">ADMIN</span>
    </div>
    <div class="topbar-right">
      <span class="admin-name" id="admin-name"></span>
      <button id="btn-logout">خروج</button>
    </div>
  </div>

  <div class="content">

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card stat-available">
        <div class="stat-val" id="stat-available">—</div>
        <div class="stat-lbl">دراجات متاحة</div>
      </div>
      <div class="stat-card stat-pending">
        <div class="stat-val" id="stat-pending">—</div>
        <div class="stat-lbl">حجوزات معلقة</div>
      </div>
      <div class="stat-card stat-active">
        <div class="stat-val" id="stat-active">—</div>
        <div class="stat-lbl">جلسات نشطة</div>
      </div>
      <div class="stat-card stat-rented">
        <div class="stat-val" id="stat-total">—</div>
        <div class="stat-lbl">إجمالي اليوم</div>
      </div>
    </div>

    <!-- Pending Bookings -->
    <div class="section">
      <div class="section-header">
        <h2>⏳ طلبات تنتظر التأكيد <span class="badge-count" id="pending-count">0</span></h2>
        <button class="btn btn-sm btn-success" onclick="refreshAll()">🔄 تحديث</button>
      </div>
      <div id="pending-list"><div class="empty-state">لا توجد طلبات معلقة</div></div>
    </div>

    <!-- Active Rentals -->
    <div class="section">
      <div class="section-header">
        <h2>🟢 الجلسات النشطة الآن</h2>
      </div>
      <div id="active-list"><div class="empty-state">لا توجد جلسات نشطة</div></div>
    </div>

    <!-- Bikes Management -->
    <div class="section">
      <div class="section-header">
        <h2>🚲 إدارة الدراجات</h2>
      </div>
      <div class="add-bike-row">
        <input type="text" id="inp-new-bike" placeholder="اسم الدراجة الجديدة مثال: A05" />
        <button class="btn btn-sm btn-success" id="btn-add-bike">+ إضافة دراجة</button>
      </div>
      <div class="bikes-grid" id="bikes-grid"></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════
//  CONFIG
// ════════════════════════════════
const SUPABASE_URL      = 'https://weuzlifquyzyjyvguvif.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_vEkF99aOD3eu0mq3C-r-Lg_D5h9qDOe';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let activeTimers = {};

// ════════════════════════════════
//  TOAST
// ════════════════════════════════
function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `show ${type}`;
  setTimeout(() => t.className = '', 3000);
}

// ════════════════════════════════
//  AUTH
// ════════════════════════════════
document.getElementById('inp-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-login').click();
});

document.getElementById('btn-login').addEventListener('click', async () => {
  const email = document.getElementById('inp-email').value.trim();
  const pass  = document.getElementById('inp-pass').value;
  const btn   = document.getElementById('btn-login');
  btn.disabled = true;
  btn.innerHTML = 'جاري التحقق... <span class="spinner"></span>';

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    btn.disabled = false; btn.textContent = 'تسجيل الدخول';
    return toast('بيانات خاطئة أو غير مصرح', 'error');
  }

  // Verify admin role
  const { data: profile } = await sb.from('profiles').select('role,full_name').eq('id', data.user.id).single();
  if (profile?.role !== 'admin') {
    await sb.auth.signOut();
    btn.disabled = false; btn.textContent = 'تسجيل الدخول';
    return toast('ليس لديك صلاحية الوصول', 'error');
  }

  document.getElementById('admin-name').textContent = profile.full_name || email;
  initDashboard();
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

// ════════════════════════════════
//  INIT
// ════════════════════════════════
async function initDashboard() {
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('dashboard').style.display  = 'block';
  await refreshAll();
  subscribeRealtime();
}

// ════════════════════════════════
//  REFRESH ALL DATA
// ════════════════════════════════
async function refreshAll() {
  await Promise.all([loadPending(), loadActive(), loadBikes()]);
  await updateStats();
}

// ════════════════════════════════
//  STATS
// ════════════════════════════════
async function updateStats() {
  const today = new Date(); today.setHours(0,0,0,0);

  const [{ data: bikes }, { data: todayBookings }] = await Promise.all([
    sb.from('bikes').select('status'),
    sb.from('bookings').select('id').gte('created_at', today.toISOString())
  ]);

  const available = bikes?.filter(b => b.status==='available').length || 0;
  const pending   = bikes?.filter(b => b.status==='pending').length   || 0;
  const rented    = bikes?.filter(b => b.status==='rented').length    || 0;

  document.getElementById('stat-available').textContent = available;
  document.getElementById('stat-pending').textContent   = pending;
  document.getElementById('stat-active').textContent    = rented;
  document.getElementById('stat-total').textContent     = todayBookings?.length || 0;
}

// ════════════════════════════════
//  PENDING BOOKINGS
// ════════════════════════════════
async function loadPending() {
  const { data } = await sb.from('bookings')
    .select('*, bikes(bike_name)')
    .eq('status', 'pending')
    .order('created_at', { ascending: true });

  const el = document.getElementById('pending-list');
  document.getElementById('pending-count').textContent = data?.length || 0;

  if (!data?.length) { el.innerHTML = '<div class="empty-state">لا توجد طلبات معلقة ✅</div>'; return; }

  el.innerHTML = '';
  data.forEach(b => {
    const ago = timeAgo(b.created_at);
    const div = document.createElement('div');
    div.className = 'booking-card pending-card';
    div.id = `booking-${b.id}`;
    div.innerHTML = `
      <div class="bc-avatar pending">⏳</div>
      <div class="bc-info">
        <div class="bc-name">${b.customer_name || 'عميل'}</div>
        <div class="bc-meta">
          <span>📱 ${b.customer_phone || '—'}</span>
          <span>🚲 ${b.bikes?.bike_name || '—'}</span>
          <span>⏱ ${b.duration_label}</span>
          <span style="color:var(--warn)">${ago}</span>
        </div>
      </div>
      <div class="bc-actions">
        <button class="btn btn-sm btn-success" onclick="startRental('${b.id}','${b.bike_id}')">▶ ابدأ</button>
        <button class="btn btn-sm btn-danger"  onclick="cancelBooking('${b.id}','${b.bike_id}')">✕ إلغاء</button>
      </div>
    `;
    el.appendChild(div);
  });
}

// ════════════════════════════════
//  ACTIVE RENTALS
// ════════════════════════════════
async function loadActive() {
  const { data } = await sb.from('bookings')
    .select('*, bikes(bike_name)')
    .eq('status', 'active')
    .order('started_at', { ascending: true });

  const el = document.getElementById('active-list');
  // Clear existing timers
  Object.values(activeTimers).forEach(clearInterval);
  activeTimers = {};

  if (!data?.length) { el.innerHTML = '<div class="empty-state">لا توجد جلسات نشطة حالياً</div>'; return; }

  el.innerHTML = '';
  data.forEach(b => {
    const div = document.createElement('div');
    div.className = 'booking-card active-card';
    div.id = `active-${b.id}`;
    div.innerHTML = `
      <div class="bc-avatar active">🟢</div>
      <div class="bc-info">
        <div class="bc-name">${b.customer_name || 'عميل'}</div>
        <div class="bc-meta">
          <span>📱 ${b.customer_phone || '—'}</span>
          <span>🚲 ${b.bikes?.bike_name || '—'}</span>
          <span>⏱ ${b.duration_label}</span>
        </div>
      </div>
      <div class="bc-actions">
        <span class="bc-timer" id="timer-${b.id}">—</span>
        <button class="btn btn-sm btn-danger" onclick="endRental('${b.id}','${b.bike_id}')">■ إنهاء</button>
      </div>
    `;
    el.appendChild(div);
    startCountdown(b);
  });
}

function startCountdown(booking) {
  const el = document.getElementById(`timer-${booking.id}`);
  if (!el) return;
  const endTime = new Date(booking.started_at).getTime() + booking.duration_mins * 60000;

  activeTimers[booking.id] = setInterval(() => {
    const left = endTime - Date.now();
    if (left <= 0) {
      el.textContent = '⚠ انتهى';
      el.style.color = 'var(--warn)';
    } else {
      const m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
  }, 1000);
}

// ════════════════════════════════
//  ACTIONS
// ════════════════════════════════
async function startRental(bookingId, bikeId) {
  const { error } = await sb.from('bookings').update({
    status: 'active',
    started_at: new Date().toISOString()
  }).eq('id', bookingId);

  if (error) return toast(error.message, 'error');
  await sb.from('bikes').update({ status: 'rented' }).eq('id', bikeId);
  toast('✅ بدأت الجلسة');
  refreshAll();
}

async function endRental(bookingId, bikeId) {
  if (!confirm('هل تريد إنهاء هذه الجلسة؟')) return;
  const { error } = await sb.from('bookings').update({
    status: 'completed',
    ended_at: new Date().toISOString()
  }).eq('id', bookingId);

  if (error) return toast(error.message, 'error');
  await sb.from('bikes').update({ status: 'available' }).eq('id', bikeId);
  toast('✅ انتهت الجلسة');
  refreshAll();
}

async function cancelBooking(bookingId, bikeId) {
  if (!confirm('إلغاء هذا الحجز؟')) return;
  await sb.from('bookings').update({ status: 'cancelled' }).eq('id', bookingId);
  await sb.from('bikes').update({ status: 'available' }).eq('id', bikeId);
  toast('تم الإلغاء', 'error');
  refreshAll();
}

// ════════════════════════════════
//  BIKES MANAGEMENT
// ════════════════════════════════
async function loadBikes() {
  const { data: bikes } = await sb.from('bikes').select('*').order('bike_name');
  const grid = document.getElementById('bikes-grid');
  if (!bikes?.length) { grid.innerHTML = '<div class="empty-state">لا توجد دراجات</div>'; return; }

  grid.innerHTML = '';
  bikes.forEach(bike => {
    const s = { available: { cls:'tile-available', icon:'🟢', lbl:'متاحة' }, rented: { cls:'tile-rented', icon:'🔴', lbl:'مؤجرة' }, pending: { cls:'tile-pending', icon:'🟡', lbl:'في الانتظار' } };
    const st = s[bike.status] || s.rented;
    const tile = document.createElement('div');
    tile.className = `bike-tile ${st.cls}`;
    tile.innerHTML = `
      <div class="tile-icon">${st.icon}</div>
      <div class="tile-name">${bike.bike_name}</div>
      <div class="tile-status" style="color:var(--sub)">${st.lbl}</div>
      ${bike.status === 'available' ? `<button class="btn btn-sm btn-danger" style="margin-top:10px;font-size:.7rem" onclick="deleteBike('${bike.id}','${bike.bike_name}')">حذف</button>` : ''}
    `;
    grid.appendChild(tile);
  });
}

document.getElementById('btn-add-bike').addEventListener('click', async () => {
  const name = document.getElementById('inp-new-bike').value.trim();
  if (!name) return toast('أدخل اسم الدراجة', 'error');
  const { error } = await sb.from('bikes').insert({ bike_name: name, status: 'available' });
  if (error) return toast(error.message, 'error');
  document.getElementById('inp-new-bike').value = '';
  toast('تمت إضافة الدراجة ✅');
  loadBikes();
  updateStats();
});

async function deleteBike(id, name) {
  if (!confirm(`حذف الدراجة "${name}"؟`)) return;
  await sb.from('bikes').delete().eq('id', id);
  toast('تم الحذف');
  loadBikes(); updateStats();
}

// ════════════════════════════════
//  REALTIME
// ════════════════════════════════
function subscribeRealtime() {
  sb.channel('admin-watch')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, () => refreshAll())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'bikes'    }, () => { loadBikes(); updateStats(); })
    .subscribe();
}

// ════════════════════════════════
//  UTILS
// ════════════════════════════════
function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (diff < 60)   return `منذ ${diff} ثانية`;
  if (diff < 3600) return `منذ ${Math.floor(diff/60)} دقيقة`;
  return `منذ ${Math.floor(diff/3600)} ساعة`;
}

// ════════════════════════════════
//  RESTORE SESSION
// ════════════════════════════════
window.addEventListener('load', async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data: profile } = await sb.from('profiles').select('role,full_name').eq('id', session.user.id).single();
  if (profile?.role === 'admin') {
    document.getElementById('admin-name').textContent = profile.full_name || session.user.email;
    initDashboard();
  }
});
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CycleFit - الطاقة الخضراء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --nature-green: #10B981; /* أخضر زمردي */
            --energy-lime: #34D399;  /* أخضر طاقة */
            --dark-forest: #064E3B; /* أخضر غامق جداً للخلفية */
            --white: #F0FDF4;       /* أبيض مائل للخضرة */
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #022c22 0%, #064e3b 100%);
            color: var(--white);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }

        .logo img {
            filter: drop-shadow(0 0 15px var(--energy-lime));
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            color: var(--energy-lime);
            text-shadow: 0 2px 10px rgba(52, 211, 153, 0.3);
        }

        .features {
            margin: 30px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .feature-item span {
            background: var(--nature-green);
            padding: 8px;
            border-radius: 12px;
            margin-left: 15px;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4);
        }

        .start-btn {
            background: linear-gradient(90deg, var(--nature-green), var(--energy-lime));
            color: var(--dark-forest);
            border: none;
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(52, 211, 153, 0.5);
        }

        #login-screen {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 25px;
            border: 1px solid var(--energy-lime);
        }

        input {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 15px;
            width: 90%;
            margin-bottom: 15px;
            border-radius: 10px;
            font-family: 'Cairo';
            font-size: 1rem;
        }

        .admin-login {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--energy-lime);
            cursor: pointer;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <div class="logo">
            <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/People/Person%20Biking.png" alt="Biking" width="120" />
            <h1>CycleFit</h1>
            <p>جازان — طاقة الطبيعة في كل حركة</p>
        </div>

        <div class="features">
            <div class="feature-item">
                <span>🌿</span> <p>تأجير صديق للبيئة</p>
            </div>
            <div class="feature-item">
                <span>⚡</span> <p>تتبع ذكي فائق السرعة</p>
            </div>
            <div class="feature-item">
                <span>🍃</span> <p>نقاط ولاء خضراء متجددة</p>
            </div>
        </div>

        <button class="start-btn" id="start-journey-btn">انطلق الآن</button>
        <p class="admin-login">دخول الإدارة</p>
    </div>

    <div id="login-screen" style="display: none; width: 350px;">
        <h2 style="color: var(--energy-lime);">مرحباً بك مجدداً</h2>
        <p>سجل دخولك لتبدأ رحلتك</p>
        <input type="text" id="full-name" placeholder="الاسم الكامل">
        <input type="tel" id="phone-number" placeholder="رقم الجوال 05xxxxxxxx">
        <button class="start-btn" id="send-otp">أرسل الرمز</button>
    </div>

    <script src="bike-rental-system.js"></script>
</body>
</html>
